# Reproduces Table 1 of the base paper (CIFAR-10, PreAct-ResNet-110).
# Paper reference values (error %, average of 5 runs) are listed per-variant
# for evaluate.py / reproduce_tables.py to diff against.

dataset: cifar10
data_dir: ../data/cifar10/cifar-10-batches-py
model: preact_resnet110
num_seeds: 5
seeds: [0, 1, 2, 3, 4]

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

variants:
  - name: "1xSkip"          # == Baseline
    equation: "x + F(x, W)"
    G: null
    lambda: 1
    paper_error: 6.31
  - name: "2xSkip"
    equation: "2x + F(x, W)"
    G: null
    lambda: 2
    paper_error: 8.41
  - name: "3xSkip"
    equation: "3x + F(x, W)"
    G: null
    lambda: 3
    paper_error: 9.23
  - name: "1xSkip+LN"
    equation: "LN(x + F(x, W))"
    G: layer_norm
    lambda: 1
    paper_error: 7.72
  - name: "2xSkip+LN"
    equation: "LN(2x + F(x, W))"
    G: layer_norm
    lambda: 2
    paper_error: 6.29
  - name: "3xSkip+LN"
    equation: "LN(3x + F(x, W))"
    G: layer_norm
    lambda: 3
    paper_error: 6.07
  - name: "1rSkip+LN"
    equation: "LN(x + F(x, W))"
    G: layer_norm
    recursive: true
    lambda: 1
    paper_error: 7.72
  - name: "2rSkip+LN"
    equation: "LN(x + LN(x + F(x, W)))"
    G: layer_norm
    recursive: true
    lambda: 2
    paper_error: 6.02
    note: "best result in Table 1"
  - name: "3rSkip+LN"
    equation: "LN(x + LN(x + LN(x + F(x, W))))"
    G: layer_norm
    recursive: true
    lambda: 3
    paper_error: 6.55
  - name: "wSkip+LN"
    equation: "LN(w . x + F(x))"
    G: layer_norm
    learnable_w: true
    w_init: 1.0
    paper_error: 8.66
    note: "critical ablation for LyASC — expect small final ||w|| (~0.24 avg per-dim), slow training start"

acceptance_tolerance_abs_points: 0.4
