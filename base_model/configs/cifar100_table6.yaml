# Reproduces Table 6 of the base paper (CIFAR-100, PreAct-ResNet at 5 depths,
# baseline vs. 2rSkip+LN).
dataset: cifar100
data_dir: ../data/cifar100/cifar-100-python
num_seeds: 5
seeds: [0, 1, 2, 3, 4]

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

depths_and_targets:
  - model: preact_resnet20
    baseline_paper_error: 33.38
    proposal_paper_error: 32.99
  - model: preact_resnet32
    baseline_paper_error: 32.00
    proposal_paper_error: 31.39
  - model: preact_resnet44
    baseline_paper_error: 30.50
    proposal_paper_error: 29.85
  - model: preact_resnet56
    baseline_paper_error: 29.81
    proposal_paper_error: 28.98
  - model: preact_resnet110
    baseline_paper_error: 28.71
    proposal_paper_error: 27.69

variants:
  - name: "baseline"
    equation: "x + F(x, W)"
    G: null
    lambda: 1
  - name: "2rSkip+LN"
    equation: "LN(x + LN(x + F(x, W)))"
    G: layer_norm
    recursive: true
    lambda: 2

acceptance_tolerance_abs_points: 0.4
