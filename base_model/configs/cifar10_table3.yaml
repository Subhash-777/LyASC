# Reproduces Table 3 of the base paper (CIFAR-10, PreAct-ResNet-110, contracted skip).
dataset: cifar10
data_dir: ../data/cifar10/cifar-10-batches-py
model: preact_resnet110
num_seeds: 5
seeds: [0, 1, 2, 3, 4]

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

variants:
  - name: "baseline"
    equation: "x + F(x, W)"
    G: null
    lambda: 1
    paper_error: 6.31
  - name: "0.5xSkip"
    equation: "0.5x + F(x, W)"
    G: null
    lambda: 0.5
    paper_error: 18.61
  - name: "LN(0.5x+F)"
    equation: "LN(0.5x + F(x, W))"
    G: layer_norm
    lambda: 0.5
    paper_error: 29.88
  - name: "LN(x+2F)"
    equation: "LN(x + 2*F(x, W))"
    G: layer_norm
    scale_residual_instead: 2
    paper_error: 24.98
  - name: "LN(x+3F)"
    equation: "LN(x + 3*F(x, W))"
    G: layer_norm
    scale_residual_instead: 3
    paper_error: 61.02

acceptance_tolerance_abs_points: 0.4
