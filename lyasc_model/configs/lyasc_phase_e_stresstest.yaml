# LyASC Phase E — Stress Tests (Table 3 Equivalent) & Normalization Pairing Ablation (Table 4 Equivalent)

dataset: cifar10
data_dir: ../../base_model/data/cifar10/cifar-10-batches-py
model: preact_resnet110

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

lyasc:
  k: 1
  N: 20
  ema_decay: 0.9
  lambda0: 0.0
  cold_start_strategy: "none"
  beta_lr_multiplier: 1.0
  enable_mlflow: true

variants:
  # --- Phase E1: Table 3 Stress Cases (G() = LayerNorm2d) ---
  - name: "LyASC_stress_0.5"
    equation: "LN(alpha_l * 0.5x + (1-alpha_l) * F(x))"
    G: layer_norm
    use_layer_norm: true
    skip_scale: 0.5
    residual_scale: 1.0
    paper_comparison_target: 37.14
    note: "Table 3 contracted skip equivalent — target: LN(0.5x+F) = 37.14%"

  - name: "LyASC_stress_2.0"
    equation: "LN(alpha_l * x + (1-alpha_l) * 2F(x))"
    G: layer_norm
    use_layer_norm: true
    skip_scale: 1.0
    residual_scale: 2.0
    paper_comparison_target: 37.59
    note: "Table 3 expanded residual equivalent — target: LN(x+2F) = 37.59% (bimodal in base_model)"

  - name: "LyASC_stress_3.0"
    equation: "LN(alpha_l * x + (1-alpha_l) * 3F(x))"
    G: layer_norm
    use_layer_norm: true
    skip_scale: 1.0
    residual_scale: 3.0
    paper_comparison_target: 49.27
    note: "Table 3 expanded residual equivalent — target: LN(x+3F) = 49.27%"

  # --- Phase E2: Normalization Pairing Ablations ---
  - name: "LyASC_noG"
    equation: "alpha_l * x + (1-alpha_l) * F(x)"
    G: null
    use_layer_norm: false
    use_batch_norm: false
    note: "Phase E2: no normalization after gate (relies on backbone BN)"

  - name: "LyASC+BN"
    equation: "BN(alpha_l * x + (1-alpha_l) * F(x))"
    G: batch_norm
    use_layer_norm: false
    use_batch_norm: true
    note: "Phase E2: BatchNorm2d after gate (Table 4 equivalence test)"

acceptance_tolerance_abs_points: 0.4
