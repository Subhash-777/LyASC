# LyASC Section 7 Phase D — Cold-Start Strategy Ablation (G() = LayerNorm2d)
# Compares cold-start strategies: 'none' (control), 'warmup' (alpha=0.5 for 1000 iters), 'damped' (linear feedback ramp for 1000 iters)

dataset: cifar10
data_dir: ../../base_model/data/cifar10/cifar-10-batches-py
model: preact_resnet110
num_seeds: 3
seeds: [0, 1, 2]

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

# LyASC-specific hyperparameters with LayerNorm enabled
lyasc:
  k: 1
  N: 20
  ema_decay: 0.9
  lambda0: 0.0
  use_layer_norm: true
  beta_lr_multiplier: 1.0
  enable_mlflow: true

variants:
  - name: "LyASC+LN_none"
    cold_start_strategy: "none"
    cold_start_warmup_iters: 1000
    use_layer_norm: true
    equation: "LN(alpha_l * x + (1-alpha_l) * F(x))"
    note: "Phase D control strategy: un-gated (none)"

  - name: "LyASC+LN_warmup"
    cold_start_strategy: "warmup"
    cold_start_warmup_iters: 1000
    use_layer_norm: true
    equation: "LN(0.5*x + 0.5*F(x)) for t<1000, then LN(alpha_l*x + (1-alpha_l)*F(x))"
    note: "Phase D strategy: hard warmup (alpha=0.5 during t < 1000 iters)"

  - name: "LyASC+LN_damped"
    cold_start_strategy: "damped"
    cold_start_warmup_iters: 1000
    use_layer_norm: true
    equation: "LN(alpha_l_damped * x + (1-alpha_l_damped) * F(x)) with linear w=t/1000 feedback scale"
    note: "Phase D strategy: damped feedback ramp during t < 1000 iters"

acceptance_tolerance_abs_points: 0.4
