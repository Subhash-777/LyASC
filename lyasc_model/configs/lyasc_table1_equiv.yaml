# LyASC Table 1 equivalent — CIFAR-10, PreAct-ResNet-110
# Matches base_model/configs/cifar10_table1.yaml protocol EXACTLY, with
# the LyASC variant added alongside the base variants.
#
# Per LyASC_plan.md Section 0: results are compared directly against
# base_model/results/tables/reproduced_table1_FINAL.csv (verified, read-only).

dataset: cifar10
data_dir: ../../base_model/data/cifar10/cifar-10-batches-py
model: preact_resnet110
num_seeds: 3
seeds: [0, 1, 2]

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false

lr_schedule:
  initial_lr: 0.1
  milestones_iters: [32000, 48000]
  total_iters: 64000
  gamma: 0.1

batch_size: 128
augmentation:
  pad: 4
  crop_size: 32
  random_flip: true

# LyASC-specific hyperparameters (approved Phase A decisions)
lyasc:
  k: 1                    # power-iteration steps (Phase B approved: k=1,N=20 reduces overhead from +44% to +16%)
  N: 20                   # recompute interval
  ema_decay: 0.9          # lambda EMA smoothing
  lambda0: 0.0            # stability threshold
  cold_start_strategy: none  # Phase B/C: raw behavior
  beta_lr_multiplier: 1.0
  enable_mlflow: true

variants:
  - name: "1xSkip"
    equation: "x + F(x, W)"
    G: null
    lambda: 1
    paper_error: 6.31
    note: "baseline — reuse base_model result (6.27%)"

  - name: "2rSkip+LN"
    equation: "LN(x + LN(x + F(x, W)))"
    G: layer_norm
    recursive: true
    lambda: 2
    paper_error: 6.02
    note: "best base_model result (6.15%) — primary comparison target"

  - name: "wSkip+LN"
    equation: "LN(w . x + F(x))"
    G: layer_norm
    learnable_w: true
    w_init: 1.0
    paper_error: 8.66
    note: "learnable gate baseline (8.16%) — LyASC should beat this"

  - name: "LyASC"
    equation: "alpha_l * x + (1-alpha_l) * F(x)"
    G: null
    lambda: 1
    paper_error: null
    note: "Lyapunov-Adaptive Skip Connection — the novel contribution"

acceptance_tolerance_abs_points: 0.4
